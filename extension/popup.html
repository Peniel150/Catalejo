<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Catalejo</title>
<style>
  :root { --bg:#fff; --surface:#f6f7f9; --border:#e3e6ea; --text:#14171c; --muted:#5b6470; --accent:#0b6e64; --brass:#8a5a12; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0e1116; --surface:#161a21; --border:#2a303b; --text:#e8ebf0; --muted:#9aa3b0; --accent:#4fd1bf; --brass:#e3b766; } }
  body { margin:0; width:320px; background:var(--bg); color:var(--text); font:14px/20px system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--border); font-weight:700; }
  main { padding:12px 16px; display:grid; gap:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px; }
  .stat b { display:block; font:600 20px/28px ui-monospace, monospace; }
  .muted { color:var(--muted); font-size:12px; }
  button, a.btn { all:unset; box-sizing:border-box; text-align:center; cursor:pointer; padding:8px 12px; border-radius:10px; border:1px solid var(--border); }
  .primary { background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
</style>
</head>
<body>
<header>
  <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="var(--brass)" stroke-width="2.5"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="var(--brass)" stroke-width="2"/><circle cx="12" cy="12" r="2" fill="var(--accent)"/></svg>
  catalejo
</header>
<main>
  <p id="state" class="muted" role="status"></p>
  <div class="grid">
    <div class="stat"><span class="muted">Productos Dropi vistos hoy</span><b id="dropi">0</b></div>
    <div class="stat"><span class="muted">Anuncios vistos hoy</span><b id="ads">0</b></div>
    <div class="stat"><span class="muted">Anuncios guardados</span><b id="saved">0</b></div>
    <div class="stat"><span class="muted">Competidores seguidos</span><b id="comps">0</b></div>
  </div>
  <p class="muted" id="sync"></p>
  <div class="row">
    <button id="pause" type="button">Pausar</button>
    <button id="export" type="button">Exportar datos</button>
  </div>
  <a class="btn primary" href="https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=CL&media_type=all" target="_blank" rel="noopener">Abrir biblioteca de anuncios (Chile)</a>
  <p class="muted">Catalejo solo lee lo que ya tienes en pantalla en Dropi y en la biblioteca de anuncios. No descarga creativos ni navega por su cuenta.</p>
</main>
<script src="popup.js"></script>
</body>
</html>
